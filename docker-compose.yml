version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmapulse_postgres
    restart: always
    environment:
      POSTGRES_USER: pharmapulse_user
      POSTGRES_PASSWORD: pharmapulse_pass
      POSTGRES_DB: pharmapulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapulse_user -d pharmapulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmapulse_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pharmapulse_user:pharmapulse_pass@postgres:5432/pharmapulse_db
      - SECRET_KEY=pharmapulse_sih_secret_super_key_2026_jwt_auth_decision_support
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:8000
    ports:
      - "8000:8000"
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmapulse_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api

volumes:
  postgres_data:
